# Keeps the free Supabase database awake. Free projects pause after 7 days with no activity,
# which would take Swap Stop offline until someone restores it in the dashboard.
# Every 3 days GitHub asks the database for one stop, which counts as activity. Free, no secrets:
# the key below is the PUBLIC one that is already in index.html.
# NOTE: GitHub switches off scheduled runs in a repo with no commits for 60 days (it emails first).
# Any deploy resets that clock; or re-enable it under the repo's Actions tab.
name: Keep database awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/keep-awake.yml"]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one stop
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" \
            -H "apikey: sb_publishable_bzlf8I8clINOnP_q4B1TAA_XJ8EFu08" \
            "https://veqxevwnxdplnccttyno.supabase.co/rest/v1/stops?select=id&limit=1")
          echo "HTTP $code: $(cat out.json)"
          test "$code" = "200"
