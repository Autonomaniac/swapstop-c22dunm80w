<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">

<style>
/* Layout: one column, phone first. A bookshelf header, two big actions, one search box. One decision per screen. */
:root{
  --paper:#ffffff; --ink:#1b1e22; --muted:#4a4f55; --line:#d9d5cf;
  --box-red:#b3121e; --on-red:#ffffff; --sign:#14161a; --on-sign:#fffdf6;
  --green:#1d5c3f; --on-green:#ffffff; --tint:#f6f3ef; --focus:#f2b705;
  --font:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181b; --ink:#f2f1ee; --muted:#c2c0bb; --line:#3a3d42;
  --box-red:#c42a35; --on-red:#ffffff; --sign:#0d0e10; --on-sign:#fffdf6;
  --green:#2e7d57; --on-green:#ffffff; --tint:#202327; --focus:#f2b705; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181b; --ink:#f2f1ee; --muted:#c2c0bb; --line:#3a3d42;
  --box-red:#c42a35; --on-red:#ffffff; --sign:#0d0e10; --on-sign:#fffdf6;
  --green:#2e7d57; --on-green:#ffffff; --tint:#202327; --focus:#f2b705; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shelf)}
.wrap{max-width:34rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* The header is a little bookshelf: each letter of SWAP STOP is a book spine */
:root{--shelf:#1f3550; --wood:#a8713d; --wood-dark:#7a4f27; --on-shelf:#ffffff;
  --s1:#d6303b; --s2:#f2b705; --s3:#1f9e8f; --s4:#7b4fc4; --s5:#f07c2a; --s6:#3f9b4a; --s7:#2f73d9; --s8:#e0569a; --spine-ink:#1b1e22}
.crown{background:var(--shelf);padding-block:10px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow:hidden}
.crown .wrap{display:flex;align-items:flex-end;gap:8px}
.home-btn{all:unset;cursor:pointer;flex:1;display:block;border-radius:6px}
.brand{display:flex;justify-content:center;align-items:flex-end;gap:3px;height:64px}
.brand .gap{width:14px}
.spine{display:grid;place-items:center;width:30px;border-radius:4px 4px 0 0;font-weight:700;font-size:1.25rem;line-height:1;
  background:var(--c);color:var(--t,var(--on-shelf));box-shadow:inset -4px 0 0 rgb(0 0 0 / .16), inset 0 5px 0 rgb(255 255 255 / .22);
  height:var(--h,54px);transform-origin:bottom center;position:relative;z-index:1}
.spine.swap-a,.spine.swap-c{z-index:2}
.spine.swap-b,.spine.swap-d{z-index:0}
.shelf-board{height:10px;background:var(--wood);border-top:3px solid var(--wood-dark);margin-top:0}
.back{all:unset;cursor:pointer;color:var(--on-shelf);font-weight:700;font-size:1.05rem;padding:10px 8px;min-height:44px;display:flex;align-items:center;align-self:center}
.back[hidden]{display:none!important}
@media (max-width:380px){.spine{width:25px;font-size:1.05rem}.brand .gap{width:8px}}

/* Motion: gentle and occasional. Books drop onto the shelf once, then now and then one leans and rights itself. */
@media (prefers-reduced-motion:no-preference){
  .spine{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both, lean 9s ease-in-out infinite;animation-delay:var(--d,0s), calc(var(--d,0s) + var(--l,2s))}
  @keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
  @keyframes lean{0%,88%,100%{rotate:0deg}92%{rotate:-9deg}96%{rotate:3deg}}
  /* The two S books swap places now and then (it is called Swap Stop): driven from the script
     (startSwap) with measured pixel distances, so it never depends on CSS variables resolving in time. */
  .spine.swap-a,.spine.swap-b,.spine.swap-c,.spine.swap-d{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0s)}
  /* Detective, 7s: lifts the glass to his eye, the giant magnified eye looks left, right, blinks,
     spots something (sparkle, eyebrow up), then lowers the glass and gives a little bounce. */
  .icon .det{animation:hop 7s ease-in-out infinite;transform-origin:32px 64px}
  @keyframes hop{0%,82%,100%{transform:none}86%{transform:translateY(-3px)}90%{transform:none}}
  .icon .arm{animation:raise 7s ease-in-out infinite;transform-origin:41px 41px}
  @keyframes raise{0%,8%{transform:rotate(62deg)}18%,68%{transform:rotate(0)}78%,100%{transform:rotate(62deg)}}
  .icon .pupil{animation:look 7s ease-in-out infinite}
  @keyframes look{0%,22%{transform:translate(0,0)}28%,34%{transform:translate(-3.5px,1px)}40%,46%{transform:translate(3.5px,0)}50%,100%{transform:translate(0,0)}}
  .icon .bigeye{animation:blink 7s linear infinite;transform-origin:39px 21px}
  @keyframes blink{0%,47%,51%,100%{transform:scaleY(1)}49%{transform:scaleY(.1)}}
  .icon .brow{animation:brow 7s ease-out infinite}
  @keyframes brow{0%,12%,76%,100%{transform:translateY(0);opacity:0}18%,52%,68%{transform:translateY(0);opacity:1}56%,64%{transform:translateY(-3px);opacity:1}}
  .icon .spark{animation:spark 7s ease-out infinite;transform-origin:39px 21px}
  @keyframes spark{0%,53%{opacity:0;transform:scale(.6)}58%{opacity:1;transform:scale(1.1)}68%,100%{opacity:0;transform:scale(1.4)}}

  /* Detective with camera, 7s (offset 3.5s from the other so they take turns):
     lifts the camera, flash, a little photo of a bookshelf slides out of the top, grin, lowers it, hop. */
  .icon.snap .det,.icon.snap .arm,.icon.snap .flash,.icon.snap .print,.icon.snap .grin{animation-delay:3.5s;animation-fill-mode:both}
  .icon .flash{animation:flash 7s ease-out infinite both;transform-origin:47px 10px}
  @keyframes flash{0%,34%,100%{opacity:0;transform:scale(.5)}37%{opacity:1;transform:scale(1)}48%{opacity:0;transform:scale(1.35)}}
  .icon .print{animation:print 7s ease-in-out infinite both}
  @keyframes print{0%,40%{transform:translateY(13px)}52%,68%{transform:translateY(0)}74%,100%{transform:translateY(13px)}}
  .icon .grin{animation:grin 7s ease-out infinite both}
  @keyframes grin{0%,40%,76%,100%{opacity:0}46%,72%{opacity:1}}
}
.icon{width:64px;height:64px;flex:none;overflow:visible}
.icon.detective{width:76px;height:76px;margin-block:-6px}
.icon .flash,.icon .spark,.icon .grin{opacity:0}
@media (prefers-reduced-motion:reduce){.icon .grin{opacity:1}}

.note{background:var(--tint);border-left:6px solid var(--green);padding:10px 14px;font-size:.9rem;color:var(--muted);margin-block:16px 0}
main{padding-block:20px 48px;display:grid;gap:22px}
h1,h2{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.6rem}
h2{font-size:1.3rem}
p{margin:0}
.lede{color:var(--muted)}

.big{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:72px;border:0;border-radius:14px;
  font:700 1.2rem/1.2 var(--font);cursor:pointer;padding:14px 18px;text-align:center;text-decoration:none;box-sizing:border-box}
.big.red{background:var(--box-red);color:var(--on-red)}
.big.green{background:var(--green);color:var(--on-green)}
.big.plain{background:transparent;color:var(--ink);border:3px solid var(--ink);min-height:60px;font-size:1.05rem}
.actions{display:grid;gap:14px}

label.field{display:grid;gap:8px;font-weight:700}
input[type=search]{font:1.1rem var(--font);padding:14px 16px;min-height:60px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}

.list{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.stop{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;width:100%;
  padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--paper)}
.stop:hover{border-color:var(--ink)}
.stop .name{font-weight:700;font-size:1.1rem;line-height:1.25}
.stop .meta{color:var(--muted);font-size:.95rem}
.stop .dist{font-weight:700;color:var(--green)}
.thumb{width:76px;height:76px;border-radius:8px;overflow:hidden}

.shelf{display:flex;align-items:flex-end;gap:2px;height:100%;padding:8% 6% 0;box-sizing:border-box;
  background:linear-gradient(to top,#6b4a2b 0 9%,#d9cdb8 9%)}
.shelf i{display:block;flex:1;border-radius:2px 2px 0 0}
.photo{border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%;border:2px solid var(--line);cursor:zoom-in;background:var(--tint)}
.photo.zoomed{aspect-ratio:auto;height:70vh;cursor:zoom-out}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.zoomed img{object-fit:contain}
.caption{font-size:.9rem;color:var(--muted)}

.books{list-style:none;margin:0;padding:0;border-top:2px solid var(--line)}
.books li{padding:12px 0;border-bottom:2px solid var(--line);display:grid;gap:2px}
.books .t{font-weight:700}
.books .a{color:var(--muted);font-size:.95rem}
.books mark,.stop mark{background:color-mix(in srgb,var(--focus) 45%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.unsure{font-size:.85rem;color:var(--muted)}

.row{display:flex;flex-wrap:wrap;gap:12px}
.row .big{flex:1 1 12rem}
.done{background:var(--tint);border-radius:14px;padding:18px;display:grid;gap:8px}
.small{font-size:.9rem;color:var(--muted)}
.hit-kind{font-size:.85rem;font-weight:700;color:var(--muted)}
button:disabled{opacity:.6;cursor:wait}
/* Map of every stop */
#map{height:58vh;min-height:320px;max-height:560px;border-radius:14px;border:2px solid var(--line);z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #ffffff;box-shadow:0 0 0 1px #1b1e22}
.leaflet-popup-content{font:1rem/1.4 var(--font);margin:12px 14px}
.leaflet-popup-content b{font-size:1.05rem}
.pop-open{display:block;margin-top:10px;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--green);color:var(--on-green);font:700 1rem var(--font);cursor:pointer}
.leaflet-container a.leaflet-popup-close-button{font-size:26px;width:34px;height:34px}
/* Shelf condition taps */
.cond{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cond button{min-height:56px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font:700 1rem var(--font);cursor:pointer;padding:8px}
.cond button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.condline{font-weight:700}
/* Photos waiting to send, and the home-screen tip */
.waiting{background:#fff6d6;color:#1b1e22;border:2px solid #e0a400;border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.tip{background:var(--tint);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.tip ol{margin:0;padding-left:1.3em}
.tip .row .big{min-height:56px;font-size:1rem}
/* The printable sign */
.sign{border:4px solid #1f3550;border-radius:18px;padding:22px;display:grid;gap:14px;justify-items:center;text-align:center;background:#ffffff;color:#1b1e22}
.sign h1{font-size:2rem}
.sign .stopname{font-size:1.3rem;font-weight:700}
.sign .qr{width:min(70vw,260px);height:min(70vw,260px)}
.sign .qr svg{width:100%;height:100%}
.sign .how{font-size:1.05rem;max-width:26rem}
.sign .url{font-size:.85rem;word-break:break-all;color:#4a4f55}
.sign .minishelf{display:flex;gap:3px;align-items:flex-end;height:40px}
.sign .minishelf i{display:block;width:16px;border-radius:3px 3px 0 0}
@media print{
  @page{size:A5;margin:10mm}
  body{background:#ffffff}
  .crown,.note,body::before,.noprint{display:none!important}
  .sign{border-width:3px;break-inside:avoid}
  main{padding:0}
}
@media (prefers-reduced-motion:no-preference){.big{transition:transform .08s}.big:active{transform:scale(.98)}}
</style>

function deviceId(){
  let id=null; try{id=localStorage.getItem("swapstop-device");}catch(e){}
  if(!id||!/^[A-Za-z0-9-]{16,64}$/.test(id)){
    const a=new Uint8Array(18); crypto.getRandomValues(a);
    id=Array.from(a,b=>"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-"[b%63]).join("");
    try{localStorage.setItem("swapstop-device",id);}catch(e){}
  }
  return id;
}
const DEVICE=deviceId();

// The two S books swap places every 18 s and swap back (first swap ~4 s after opening);
// the two P books do the same, 4.5 s later, so only one pair is ever moving at a time.
// Measure the real gap between each pair, THEN start the movement with that exact distance.
// The SWAP book hops over in front of the others; the STOP book slides along behind them.
let swapAnims=[];
function startSwap(){
  swapAnims.forEach(x=>x.cancel()); swapAnims=[];
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  swapPair(".swap-a",".swap-b",4000);
  swapPair(".swap-c",".swap-d",8500);
}
function swapPair(selA,selB,delay){
  const a=document.querySelector(selA), b=document.querySelector(selB); if(!a||!b||!a.animate) return;
  const dx=b.offsetLeft-a.offsetLeft; if(!dx) return;
  const path=(x,up)=>[
    {offset:0,transform:"translate(0,0)"},{offset:.04,transform:"translate(0,0)"},
    {offset:.08,transform:`translate(0,${up}px)`},{offset:.15,transform:`translate(${x}px,${up}px)`},
    {offset:.19,transform:`translate(${x}px,0)`},{offset:.52,transform:`translate(${x}px,0)`},
    {offset:.56,transform:`translate(${x}px,${up}px)`},{offset:.63,transform:`translate(0,${up}px)`},
    {offset:.67,transform:"translate(0,0)"},{offset:1,transform:"translate(0,0)"}];
  const opts={duration:18000,iterations:Infinity,delay,easing:"ease-in-out"};
  swapAnims.push(a.animate(path(dx,-14),opts), b.animate(path(-dx,-3),opts));
}
addEventListener("load",startSwap);
let swapResize; addEventListener("resize",()=>{clearTimeout(swapResize); swapResize=setTimeout(startSwap,300);});

const $=s=>document.querySelector(s);
const view=$("#view"),back=$("#back");
let history_=[]; let here=null; // here = {lat,lon} once the phone has told us
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Distances in miles (UK). Under about half a mile, a walking time reads better (80 m a minute).
const dist=m=>{ if(m==null) return ""; if(m<1000) return `${Math.round(m/80)||1} min walk`;
  const mi=m/1609.344, t=mi<20?mi.toFixed(1):String(Math.round(mi)); return `${t} ${t==="1.0"||t==="1"?"mile":"miles"} away`; };
const when=t=>{if(!t)return null;const d=new Date(t),days=Math.floor((Date.now()-d)/864e5);
  return days<1?"today":days<2?"yesterday":days<14?`${days} days ago`:d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});};
const distance=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);
  return 2*R*Math.asin(Math.sqrt(Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2));};
const photoUrl=p=>PHOTO_BASE+p.split("/").map(encodeURIComponent).join("/");

function locate(){ return new Promise((res,rej)=>{
  if(!navigator.geolocation) return rej(new Error("This phone can't share its location."));
  navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};res(here);},
    e=>rej(new Error(e.code===1?"Location is switched off for this page. You can search by town instead.":"Your phone couldn't find where you are. Try again outside, or search by town.")),
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000}); }); }

    <div class="meta">${s.last_seen?`Shelf photo ${when(s.last_seen)}`:"No photo yet"}</div></div></button></li>`;
}

// ---- Every stop, kept on the phone for a day, so "which stop are you at?" still works with no signal.
async function getAllStops(){
  if(window.__allStops) return window.__allStops;
  let cached=null; try{cached=JSON.parse(localStorage.getItem("swapstop-stops")||"null");}catch(e){}
  if(cached&&Date.now()-cached.at<864e5){ window.__allStops=cached.stops; return cached.stops; }
  try{
    const pages=await Promise.all([0,1,2,3].map(i=>sb.from("stops").select("id,name,kind,place,lat,lon").range(i*1000,i*1000+999)));
    if(pages.some(p=>p.error)) throw new Error("load");
    const stops=pages.flatMap(p=>p.data);
    try{localStorage.setItem("swapstop-stops",JSON.stringify({at:Date.now(),stops}));}catch(e){}
    window.__allStops=stops; return stops;
  }catch(e){ if(cached){ window.__allStops=cached.stops; return cached.stops; } return []; }
}
const nearestFromCache=async(pt,n)=>(await getAllStops()).map(s=>({...s,metres:distance(pt,s)})).sort((a,b)=>a.metres-b.metres).slice(0,n);

// ---- How fresh each stop's latest photo is, for the map colours.
async function getFreshness(){ const {data}=await sb.rpc("stop_freshness"); const m=new Map(); (data||[]).forEach(r=>m.set(r.stop_id,r)); return m; }
const AGE={fresh:"#3f9b4a",month:"#e0a400",none:"#d6303b"};
const ageColour=seen=>{ if(!seen) return AGE.none; const d=(Date.now()-new Date(seen))/864e5; return d<8?AGE.fresh:d<31?AGE.month:AGE.none; };
const CONDITION_LABEL={full:"Well stocked",needs_books:"Needs more books",empty:"Shelf is empty",damaged:"Wet or damaged"};

// ---- Photos waiting to send. Kept on the phone (IndexedDB) until there's signal, then sent automatically.
const idb=()=>new Promise((res,rej)=>{ const r=indexedDB.open("swapstop",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("queue",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const qAll=async()=>{ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("queue").objectStore("queue").getAll(); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); };
const qPut=async item=>{ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("queue","readwrite"); t.objectStore("queue").put(item); t.oncomplete=res; t.onerror=()=>rej(t.error); }); };
const qDel=async id=>{ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("queue","readwrite"); t.objectStore("queue").delete(id); t.oncomplete=res; t.onerror=()=>rej(t.error); }); };

// Send one visit: upload each photo, then record the visit, then check it really saved.
async function sendVisit(v,progress){
  const paths=[];
  for(let i=0;i<v.blobs.length;i++){
    progress?.(`Sending photo ${i+1} of ${v.blobs.length}…`);
    const path=`${DEVICE}/${v.id}-${i}.jpg`;
    const {error}=await sb.storage.from("shelf-photos").upload(path,v.blobs[i],{contentType:"image/jpeg",upsert:false});
    if(error&&!/exists|Duplicate/i.test(error.message)) throw Object.assign(new Error("photo"),{offline:!navigator.onLine});
    paths.push(path);
  }
  progress?.("Saving…");
  const {data:vid,error}=await sb.rpc("add_visit",{p_stop:v.stop.id,p_paths:paths,p_note:null,p_device:DEVICE,p_taken:v.takenAt,p_condition:v.condition});
  if(error) throw Object.assign(new Error(/too many/.test(error.message)?"toomany":"save"),{offline:!navigator.onLine});
  const chk=await sb.from("visits").select("id").eq("id",vid).maybeSingle();
  if(chk.error||!chk.data) throw new Error("confirm");
  return vid;
}
let flushing=false;
async function flushQueue(){
  if(flushing||!navigator.onLine) return; flushing=true;
  try{ for(const v of await qAll()){ try{ await sendVisit(v); await qDel(v.id); }catch(e){ break; } } }
  catch(e){} finally{ flushing=false; showWaiting(); }
}
async function showWaiting(){
  const box=$("#waiting"); if(!box) return;
  let n=0; try{ n=(await qAll()).length; }catch(e){}
  box.hidden=!n;
  if(n) box.innerHTML=`<b>${n===1?"1 visit is":n+" visits are"} waiting to send.</b><span>${navigator.onLine?"Sending now…":"They'll send by themselves the next time Swap Stop is open and your phone has signal."}</span>`;
}
addEventListener("online",flushQueue); setInterval(flushQueue,60000);

const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function showTip(){
  const box=$("#tip"); if(!box) return;
  let visits=0,dismissed=false; try{ visits=+localStorage.getItem("swapstop-visits")||0; dismissed=localStorage.getItem("swapstop-tip")==="no"; }catch(e){}
  if(standalone()||dismissed||visits<2){ box.hidden=true; return; }
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  box.hidden=false;
  box.innerHTML=`<b>Put Swap Stop on your home screen</b>
   ${installPrompt?`<p>It then opens like an app, with one tap.</p>`
     :ios?`<ol><li>Tap the Share button (the square with an arrow) at the bottom of the screen.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>`
     :`<ol><li>Tap the three dots at the top right of the screen.</li><li>Tap <b>Add to Home screen</b> (or <b>Install app</b>).</li><li>Tap <b>Add</b>.</li></ol>`}
   <div class="row">${installPrompt?'<button class="big green" id="tipadd">Add to my home screen</button>':""}<button class="big plain" id="tipno">No thanks</button></div>`;
  $("#tipno").onclick=()=>{ try{localStorage.setItem("swapstop-tip","no");}catch(e){} box.hidden=true; };
  const a=$("#tipadd"); if(a) a.onclick=async()=>{ installPrompt.prompt(); await installPrompt.userChoice.catch(()=>{}); installPrompt=null; box.hidden=true; };

    try{ const blob=await shrink(f); files.push({blob,url:URL.createObjectURL(blob),taken:meta.taken||null}); }
    catch(err){ $("#msg").textContent="One of those photos couldn't be opened. Try choosing it again."; return; }
   }
   go("whichstop",{files,gps});
  };
 },
 async whichstop({files,gps}){
  const taken=files.map(f=>f.taken).filter(Boolean).sort()[0];
  const intro=`${taken?`<p class="lede">These photos were taken ${when(taken)}.</p>`:""}`;
  const toPhoto=s=>go("photo",{...s,preset:files});
  if(gps){
   busy("Finding the stops where these photos were taken…");
   const {data,error}=await sb.rpc("stops_near",{p_lat:gps.lat,p_lon:gps.lon,p_limit:6});
   if(error) return oops("The book stop list didn't load. Check you have signal.",()=>go("whichstop",{files,gps},false));
   view.innerHTML=`<h1>Which stop is it?</h1>${intro}
    <p class="lede">These stops are closest to where the photos were taken.</p>
    <ul class="list">${data.map(s=>stopCard(s,"pick")).join("")}</ul>
    <button class="big plain" id="new">It isn't on the list</button>
    <button class="big plain" id="byname">Search for it by name instead</button>`;
   view.querySelectorAll(".stop").forEach(b=>b.onclick=()=>toPhoto(data.find(x=>x.id===b.dataset.id)));
   $("#new").onclick=()=>go("newstop",{at:gps,preset:files});
   $("#byname").onclick=()=>go("whichstop",{files,gps:null});
   return;
  }
  view.innerHTML=`<h1>Which stop is it?</h1>${intro}
   <p class="lede">Type the name of the stop or the village it's in.</p>
   <form id="wf"><label class="field" for="wq">Stop or village
    <input type="search" id="wq" placeholder="For example: Cubert" autocomplete="off" enterkeyhint="search"></label></form>
   <ul class="list" id="wl"></ul>
   <p class="small">To add a stop that isn't on the map yet, you need to be standing at it, or use a photo that saved its location.</p>`;
  $("#wf").onsubmit=async e=>{ e.preventDefault(); const q=$("#wq").value.trim(); if(q.length<3) return;
   const {data,error}=await sb.rpc("search_all",{p_q:q,p_lat:here?.lat??null,p_lon:here?.lon??null});
   const places=(data||[]).filter(h=>h.hit==="place");
   $("#wl").innerHTML=error?'<li class="small">The search didn\'t work. Check you have signal.</li>'
    :places.length?places.map((h,i)=>`<li><button class="stop" data-i="${i}"><div class="thumb"><div class="shelf" style="background:var(--tint)"></div></div>
      <div><div class="name">${esc(h.stop_name)}</div>${h.place?`<div class="meta">${esc(h.place)}</div>`:""}</div></button></li>`).join("")
    :'<li class="small">No stop with that name. Try just the village name.</li>';
   $("#wl").querySelectorAll(".stop").forEach(b=>b.onclick=()=>{const h=places[+b.dataset.i]; toPhoto({id:h.stop_id,name:h.stop_name,place:h.place});});
  };
 },
 async pick(){
  busy("Finding where you are…");
  try{ await locate(); }catch(e){ return oops(e.message,()=>go("pick",null,false)); }
  let {data,error}=await sb.rpc("stops_near",{p_lat:here.lat,p_lon:here.lon,p_limit:6}).catch(e=>({error:e}));
  let offline=false;
  if(error||!data){ data=await nearestFromCache(here,6); offline=true; }
  if(!data.length) return oops("The book stop list didn't load, and none is saved on this phone yet. Open Swap Stop once where you have signal.",()=>go("pick",null,false));
  view.innerHTML=`<h1>Which stop are you at?</h1>
   ${offline?'<p class="waiting">No signal here. That\'s fine: take your photos, and they\'ll send by themselves once you have signal again.</p>':""}
   <p class="lede">Pick it from the list, so every photo of the same stop stays together.</p>
   ${data.length?`<ul class="list">${data.map(s=>stopCard(s,"pick")).join("")}</ul>`:""}
   <button class="big plain" id="new">My stop isn't on the list</button>`;
  wireCards(data); $("#new").onclick=()=>go("newstop");
 },
 newstop(opt){
  const at=opt?.at||null, preset=opt?.preset||null;
  view.innerHTML=`<h1>Add your stop</h1>
   <p class="lede">${at?"We'll put it where your photo was taken.":"You need to be standing at it, so the map puts it in the right place."}</p>
   <label class="field" for="sname">What is it called?
    <input type="search" id="sname" placeholder="For example: Cubert bus shelter" maxlength="80" autocomplete="off"></label>
   <p style="font-weight:700">What is it?</p>
   <div class="actions" id="kinds">
    <button class="big plain" data-k="phone_box">A phone box</button>
    <button class="big plain" data-k="bus_shelter">A bus shelter</button>
    <button class="big plain" data-k="other">Something else</button>
   </div>
   <p id="msg" class="small" role="status"></p>`;
  view.querySelectorAll("#kinds button").forEach(b=>b.onclick=async()=>{
   const name=$("#sname").value.trim(); if(name.length<2){ $("#msg").textContent="Please type a name for the stop first."; $("#sname").focus(); return; }
   let pt=at;
   if(!pt){
    $("#msg").textContent="Checking where you are…";
    try{ await locate(); }catch(e){ $("#msg").textContent=e.message; return; }
    if(here.acc>60){ $("#msg").textContent=`Your phone only knows where you are to within ${Math.round(here.acc)} metres. Step outside or wait a moment, then tap again.`; return; }
    pt=here;
   }
   const {data,error}=await sb.rpc("add_stop",{p_name:name,p_kind:b.dataset.k,p_place:null,p_lat:pt.lat,p_lon:pt.lon,p_device:DEVICE});
   if(error){ $("#msg").textContent=/too many/.test(error.message)?"This phone has added a lot of stops today. Please try again tomorrow.":"The stop didn't save. Check you have signal and tap again."; return; }
   if(!data.ok){ const s={id:data.existing_id,name:data.existing_name,kind:b.dataset.k};
     view.innerHTML=`<div class="done"><h2>This stop is already on the map</h2><p>It's called "${esc(s.name)}". We'll add your photo to it, so all the photos stay together.</p></div>
      <button class="big green" id="useit">Add my photo to ${esc(s.name)}</button>`;
     $("#useit").onclick=()=>go("photo",{...s,preset}); return; }
   go("photo",{id:data.id,name,kind:b.dataset.k,place:null,preset});
  });
 },
 photo(s){
  let files=s.preset?[...s.preset]:[];
  view.innerHTML=`<h1>${files.length?"Check your photos":"Take photos of the shelves"}</h1>
   <p class="lede">${esc(s.name)}</p>
   <p>Use <b>one photo per shelf</b>, close enough that you can read the spines. Up to 3 photos. Please photograph only the books, no people or car number plates.</p>
   <div id="pv" class="list"></div>
   <label class="big red" for="cam" style="cursor:pointer" id="camlabel">Take a photo</label>
   <input type="file" id="cam" accept="image/*" capture="environment" hidden>
   <label class="big plain" for="pickgal" style="cursor:pointer" id="gallabel">Choose photos from my phone</label>
   <input type="file" id="pickgal" accept="image/*" multiple hidden>
   <div id="condbox" hidden>
    <p style="font-weight:700;margin-bottom:8px">How's the shelf looking? (you can skip this)</p>
    <div class="cond" id="cond">
     <button data-c="full" aria-pressed="false">Well stocked</button>
     <button data-c="needs_books" aria-pressed="false">Needs books</button>
     <button data-c="empty" aria-pressed="false">Empty</button>
     <button data-c="damaged" aria-pressed="false">Wet or damaged</button>
    </div>
   </div>
   <button class="big green" id="send" hidden>Save these photos</button>
   <p id="msg" class="small" role="status"></p>`;
  const draw=()=>{ $("#pv").innerHTML=files.map((f,i)=>`<div class="photo"><img src="${f.url}" alt="Shelf photo ${i+1}"></div>
     <button class="big plain" data-rm="${i}">Remove photo ${i+1}</button>`).join("");
   $("#pv").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{files.splice(+b.dataset.rm,1);draw();});
   $("#camlabel").textContent=files.length?"Take another photo":"Take a photo"; $("#gallabel").textContent=files.length?"Choose more photos from my phone":"Choose photos from my phone"; $("#camlabel").hidden=files.length>=3; $("#gallabel").hidden=files.length>=3; $("#send").hidden=!files.length; $("#condbox").hidden=!files.length; };
  let condition=null;
  view.querySelectorAll("#cond button").forEach(b=>b.onclick=()=>{
   condition=condition===b.dataset.c?null:b.dataset.c;
   view.querySelectorAll("#cond button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.c===condition))); });
  // Adds one photo from the camera, or several from the gallery, never more than 3 in total.
  const addFile=async e=>{ const room=3-files.length; const picked=[...e.target.files]; e.target.value=""; if(!picked.length) return;
   const take=picked.slice(0,room);
   $("#msg").textContent=take.length>1?"Getting the photos ready…":"Getting the photo ready…";
   let failed=0;
   for(const f of take){
    const meta=await readExif(f).catch(()=>({}));
    try{ const blob=await shrink(f); files.push({blob,url:URL.createObjectURL(blob),taken:meta.taken||null}); }catch(err){ failed++; }
   }
   draw();
   $("#msg").textContent=failed?"One of those photos couldn't be opened. Try choosing it again."
     :picked.length>room?`Only ${room===1?"1 more photo fits":room+" more photos fit"}, so the first ${room} were added.`:""; };
  $("#cam").onchange=addFile; $("#pickgal").onchange=addFile; draw();
  $("#send").onclick=async()=>{ const btn=$("#send"); btn.disabled=true; $("#camlabel").hidden=true; $("#gallabel").hidden=true;
   const v={id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`, stop:{id:s.id,name:s.name,kind:s.kind,place:s.place,lat:s.lat,lon:s.lon},
     blobs:files.map(f=>f.blob), takenAt:files.map(f=>f.taken).filter(Boolean).sort()[0]||new Date().toISOString(), condition};
   const keepForLater=async()=>{ try{ await qPut(v); go("thanks",{...s,queued:true}); }
     catch(e){ btn.disabled=false; $("#msg").textContent="There's no signal and the photos couldn't be kept on this phone. Try again when you have signal."; } };
   if(!navigator.onLine) return keepForLater();
   try{ await sendVisit(v,t=>{$("#msg").textContent=t;}); go("thanks",s); }
   catch(e){
    if(e.message==="toomany"){ btn.disabled=false; $("#msg").textContent="This phone has sent a lot of photos in the last hour. Please try again later."; return; }
    // Anything else here is almost always the signal dropping: keep them and send later.
    keepForLater();
   } };
 },
 thanks(s){
  view.innerHTML=(s.queued?`<div class="done"><h1>Saved on your phone</h1>
   <p>There's no signal right now, so your photos of ${esc(s.name)} are kept safe on this phone.</p>
   <p>They'll send by themselves the next time Swap Stop is open and you have signal. You don't need to do anything else.</p></div>`
   :`<div class="done"><h1>Thank you</h1>
   <p>Your photos of ${esc(s.name)} are saved. Anyone looking at this stop can see them now.</p>
   <p class="small">The book titles are read from the photos later, so they can be searched.</p></div>`)+`
   <button class="big green" id="see">See ${esc(s.name)}</button>
   <button class="big plain" id="h">Back to the start</button>`;
  $("#see").onclick=()=>{history_=[["home"]]; go("stop",s);};
  $("#h").onclick=()=>{history_=[]; go("home");};
 },
 async search(q){
  busy("Searching…");
  const {data,error}=await sb.rpc("search_all",{p_q:q,p_lat:here?.lat??null,p_lon:here?.lon??null});
  if(error) return oops("The search didn't work. Check you have signal.",()=>go("search",q,false));
  const n=q.toLowerCase(); const hl=x=>esc(x).replace(new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig"),m=>`<mark>${m}</mark>`);
  view.innerHTML=`<h1>Results for “${esc(q)}”</h1>
   ${data.length?`<ul class="list">${data.map((h,i)=>`<li><button class="stop" data-i="${i}">
     <div class="thumb"><div class="shelf" style="background:var(--tint)"></div></div>
     <div>${h.hit==="place"?`<div class="hit-kind">Place</div><div class="name">${hl(h.stop_name)}</div>${h.place?`<div class="meta">${hl(h.place)}</div>`:""}`
       :`<div class="hit-kind">Book</div><div class="name">${hl(h.title)}</div>${h.author?`<div class="meta">${hl(h.author)}</div>`:""}<div class="meta">At ${esc(h.stop_name)}, seen ${when(h.seen)}</div>`}
     ${h.metres!=null?`<div class="meta"><span class="dist">${dist(h.metres)}</span></div>`:""}</div></button></li>`).join("")}</ul>`
   :`<div class="done"><h2>Nothing found yet</h2><p>No stop name or shelf photo matches that. Try a shorter word, like just the author's surname or the village name.</p></div>`}
   <button class="big plain" id="again">Search again</button>`;
  view.querySelectorAll(".stop").forEach(b=>b.onclick=async()=>{ const h=data[+b.dataset.i];
   const {data:s}=await sb.from("stops").select("id,name,kind,place,lat,lon").eq("id",h.stop_id).maybeSingle();
   if(s) go("stop",{...s,metres:h.metres}); });
  $("#again").onclick=()=>{history_=[]; go("home"); $("#q").focus();};
 }
};

// Read when and where a photo was taken from its EXIF block (JPEG only). We only READ it here:
// the photo we upload is redrawn on a canvas, which drops all metadata, including the location.
async function readExif(file){
  const buf=new DataView(await file.slice(0,262144).arrayBuffer());
  if(buf.getUint16(0)!==0xFFD8) return {};
  let o=2;
  while(o+4<buf.byteLength){
    const marker=buf.getUint16(o), len=buf.getUint16(o+2);
    if(marker===0xFFE1 && buf.getUint32(o+4)===0x45786966){ // "Exif"
      const t=o+10, le=buf.getUint16(t)===0x4949;
      const u16=p=>buf.getUint16(t+p,le), u32=p=>buf.getUint32(t+p,le);
      const ifd=p=>{const n=u16(p),m={};for(let i=0;i<n;i++){const e=p+2+i*12;m[u16(e)]={type:u16(e+2),count:u32(e+4),off:e+8};}return m;};
      const val=en=>en.count*({2:1,5:8}[en.type]||4)>4?u32(en.off):en.off;
      const ascii=en=>{let s="",p=val(en);for(let i=0;i<en.count-1;i++)s+=String.fromCharCode(buf.getUint8(t+p+i));return s;};
      const rat=(p,i)=>u32(p+i*8)/(u32(p+i*8+4)||1);
      const dms=en=>{const p=val(en);return rat(p,0)+rat(p,1)/60+rat(p,2)/3600;};
      const out={}; const ifd0=ifd(u32(4));
      if(ifd0[0x8769]){ const ex=ifd(u32(ifd0[0x8769].off)); const d=ex[0x9003]||ex[0x9004];
        if(d){ const m=ascii(d).match(/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
          if(m){ const dt=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]); if(!isNaN(dt)&&dt<=new Date()) out.taken=dt.toISOString(); } } }
      if(ifd0[0x8825]){ const g=ifd(u32(ifd0[0x8825].off));
        if(g[2]&&g[4]){ let lat=dms(g[2]),lon=dms(g[4]);
          if(g[1]&&String.fromCharCode(buf.getUint8(g[1].off+t))==="S") lat=-lat;
          if(g[3]&&String.fromCharCode(buf.getUint8(g[3].off+t))==="W") lon=-lon;
          if(lat>49&&lat<61&&lon>-9&&lon<2.5) out.gps={lat,lon}; } }
      return out;
    }
    if((marker&0xFF00)!==0xFF00) break; o+=2+len;
  }
  return {};
}

// Phone photos can be 12+ megapixels. Shrink to the long edge the reader uses (2,576 px) as a JPEG.
async function shrink(file){
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const k=Math.min(1,2576/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.88));
}

// A link with ?stop=<id> (from a printed sign's QR code) opens that stop straight away.
(async()=>{
  const id=new URLSearchParams(location.search).get("stop");
  go("home");
  getAllStops(); // keep a copy of the stop list on the phone for places with no signal
  if(!id) { flushQueue(); return; }
  const {data:s}=await sb.from("stops").select("id,name,kind,place,lat,lon").eq("id",id).maybeSingle();
  const st=s||(await getAllStops()).find(x=>x.id===id);
  if(st) go("stop",st);
  flushQueue();
})();
</script>
